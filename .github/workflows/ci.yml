name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint Solidity
        run: npx solhint 'contracts/**/*.sol' || true  # non-blocking; flip to strict by removing '|| true'

      - name: Test
        run: npm test
